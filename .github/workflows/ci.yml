name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: it installs exactly what the lockfile pins and
      # fails if package.json and the lockfile disagree, which `install` would
      # quietly paper over by rewriting the lockfile.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Rebuilds from scratch and fails if the committed build output moved.
      #
      # This is the gate that matters most in this repo. Shopify serves
      # theme/assets/ from what `theme push` uploads, so the built files have to
      # be committed — which means they can drift from their source. When that
      # happens the storefront runs code the diff does not describe, and nothing
      # else in this pipeline would notice.
      - name: Verify committed bundle matches source
        run: npm run verify:bundle

  e2e:
    name: End-to-end (live store)
    runs-on: ubuntu-latest
    needs: verify

    # Deliberately a separate job from `verify`.
    #
    # These tests drive a real Shopify storefront, so they can fail for reasons
    # that have nothing to do with the commit — an outage, a merchant edit, a
    # network blip. Keeping them apart means the unit pipeline stays a statement
    # about the code, and a red storefront never blocks unrelated work.
    #
    # Skipped entirely without the store secrets, which is the normal state for a
    # fork. The specs also self-skip on missing configuration, so this condition
    # is belt and braces rather than the only guard.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Chromium only. These assert on markup and network traffic, not on
      # cross-browser rendering, so three engines would triple the runtime to
      # tell us the same thing.
      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run end-to-end tests
        env:
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_STORE_PASSWORD: ${{ secrets.SHOPIFY_STORE_PASSWORD }}
        run: npm run test:e2e

      # Traces and screenshots are only written for failures, so this uploads
      # nothing on a green run.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
